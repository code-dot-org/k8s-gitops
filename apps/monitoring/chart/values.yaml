codeai_cluster_config: {}
# Populated by cluster-infra from infrastructure's existing OpenTofu outputs.
# Empty defaults let disabled monitoring render before that handoff is published.
amp:
  workspaceArn: ""
  remoteWriteUrl: ""
  region: ""
metrics:
  # Set this to an existing compatible exporter and leave its dependency disabled
  # when inventory finds one. Never scrape both a Service and its pod endpoints.
  kubeStateMetricsAddress: monitoring-kube-state-metrics.monitoring.svc:8080

alloy:
  enabled: false
  fullnameOverride: monitoring-alloy
  crds:
    create: false
  rbac:
    create: false
  serviceAccount:
    create: false
    name: monitoring-alloy
  alloy:
    configMap:
      create: false
      name: monitoring-alloy
      key: config.alloy
    clustering:
      enabled: false
    enableReporting: false
    storagePath: /var/lib/alloy
    extraEnv:
      - name: AWS_STS_REGIONAL_ENDPOINTS
        value: regional
    mounts:
      extra:
        - name: storage
          mountPath: /var/lib/alloy
    securityContext:
      runAsNonRoot: true
      runAsUser: 473
      runAsGroup: 473
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 2Gi
  global:
    podSecurityContext:
      fsGroup: 473
  configReloader:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 64Mi
  controller:
    type: deployment
    replicas: 1
    updateStrategy:
      type: Recreate
    nodeSelector:
      kubernetes.io/os: linux
    # No frontend taint toleration: run centrally and discover every node.
    tolerations: []
    volumes:
      extra:
        - name: storage
          emptyDir:
            sizeLimit: 1Gi

kube-state-metrics:
  enabled: false
  fullnameOverride: monitoring-kube-state-metrics
  replicas: 1
  updateStrategy: Recreate
  autosharding:
    enabled: false
  prometheusScrape: false
  # Every metric below must also be on the Alloy keep-list in files/config.alloy,
  # and every label it introduces on the Alloy labelkeep, or it never reaches AMP.
  # No DaemonSets run on Auto Mode (system daemons are AWS-managed), so that
  # collector is off.
  collectors: [nodes, pods, deployments, statefulsets, horizontalpodautoscalers]
  metricAllowlist:
    # Nodes: inventory, Ready/pressure conditions, allocatable (capacity denominators), pool label.
    - kube_node_info
    - kube_node_labels
    - kube_node_status_condition
    - kube_node_status_allocatable
    # Pods: placement, phase, restarts, waiting/exit reasons, requests and limits.
    - kube_pod_info
    - kube_pod_status_phase
    - kube_pod_container_status_restarts_total
    - kube_pod_container_status_waiting_reason
    - kube_pod_container_status_last_terminated_reason
    - kube_pod_container_resource_requests
    - kube_pod_container_resource_limits
    # Workloads: desired vs available/ready, and updated for rollout progress.
    - kube_deployment_spec_replicas
    - kube_deployment_status_replicas_available
    - kube_deployment_status_replicas_updated
    - kube_statefulset_replicas
    - kube_statefulset_status_replicas_ready
    - kube_statefulset_status_replicas_updated
    # Autoscaling: current vs desired vs ceiling.
    - kube_horizontalpodautoscaler_spec_max_replicas
    - kube_horizontalpodautoscaler_status_current_replicas
    - kube_horizontalpodautoscaler_status_desired_replicas
  # kube_node_labels only carries labels named here (as label_<sanitised_key>).
  # karpenter.sh/nodepool → label_karpenter_sh_nodepool: system / general-purpose / frontend.
  metricLabelsAllowlist:
    - nodes=[karpenter.sh/nodepool]
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 16Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 64Mi
