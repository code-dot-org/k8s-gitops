apiVersion: v2
name: monitoring
description: Kubernetes metrics sent to the existing Amazon Managed Service for Prometheus workspace
type: application
version: 0.1.1
dependencies:
  - name: alloy
    repository: https://grafana.github.io/helm-charts
    version: 1.12.1
    condition: alloy.enabled
  - name: kube-state-metrics
    repository: https://prometheus-community.github.io/helm-charts
    version: 8.5.0
    condition: kube-state-metrics.enabled
