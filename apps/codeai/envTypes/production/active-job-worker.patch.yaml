# The backend component pins the worker's RAILS_ENV to adhoc so it renders
# identically everywhere; envTypes override it here. Mirrors the Helm side's
# activeJobWorker.RAILS_ENV in ../production.values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-active-job-worker
spec:
  template:
    spec:
      containers:
        - name: active-job-worker
          env:
            - name: RAILS_ENV
              value: production
            - name: RACK_ENV
              value: production
