RAILS_ENV: staging
# The chart pins activeJobWorker.RAILS_ENV to adhoc and does not inherit the
# chart-wide RAILS_ENV; override it here so the worker runs as this envType.
activeJobWorker:
  RAILS_ENV: staging
  priorityMode: low
  # Covers the 30 minute AnonymousGeoBackfillingJob cap with margin. The pod
  # waits only as long as its current job runs; an idle worker exits in seconds.
  terminationGracePeriodSeconds: 2100
# dashboard_workers: 10

# IRSA role for the app pods, created by the standard-envtypes chart
# (apps/infra/standard-envtypes/chart/templates/aws/single-namespace-envtypes-app-iam.yaml).
# Its trust policy names system:serviceaccount:staging:cdo-app.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::475661607190:role/codeai-k8s-app-staging
healthChecks:
  enabled: true
require_external_secrets: true
scheduling:
  nodeSelector:
    code.org/workload-class: frontend
  tolerations:
    - key: code.org/workload-class
      operator: Equal
      value: frontend
      effect: NoSchedule
