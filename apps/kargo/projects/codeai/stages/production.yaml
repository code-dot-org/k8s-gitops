# Kargo Stage: production (codeai project).
#
# Promotion to production is a manual decision, guarded by the `legacy-ancestry`
# step below. The Freight's image commit must already be contained in the legacy
# `production` branch, so a k8s worker never runs code ahead of the production
# database schema: legacy's EC2 deploy is the only path that migrates that
# database, and this image carries no migrations.
#
# When to promote, what each failure message means, rollback and the accepted
# gaps: docs/production-promotion.md at the repository root.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: kargo-project-codeai
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-project-codeai
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/code-dot-org/k8s-gitops.git
      steps:
        # Gate: legacy-ancestry. Asks the GitHub compare API whether the image
        # commit (the index annotation CI stamps on every cdo-rails build) is
        # contained in the legacy `production` branch. Runs before anything is
        # cloned or written, and fails closed:
        #   404 or 422             no revision annotation, or GitHub does not know the commit
        #   200 with ahead_by > 0  the image is ahead of legacy production
        #   5xx or rate limited    re-polled every 30s until the 5 minute timeout, then fails
        #   timeout, no connection an error, retried with backoff until the 5 minute timeout
        # Request errors count against retry.errorThreshold, not the timeout, and
        # Kargo's default threshold of 1 stops at the first one. 20 is more attempts
        # than fit in 5 minutes, so the timeout governs in every case.
        # Removing this step is an incident action; see docs/production-promotion.md.
        - uses: http
          as: legacy-ancestry
          retry:
            timeout: 5m
            errorThreshold: 20
          config:
            method: GET
            url: https://api.github.com/repos/code-dot-org/code-dot-org/compare/production...${{ imageFrom("ghcr.io/code-dot-org/cdo-rails").Annotations["org.opencontainers.image.revision"] }}
            headers:
              - name: Accept
                value: application/vnd.github+json
            timeout: 30s
            successExpression: response.status == 200 && response.body.ahead_by == 0
            failureExpression: response.status == 404 || response.status == 422 || (response.status == 200 && response.body.ahead_by > 0)
            errorExpression: >-
              response.status == 200
              ? ("image commit is " + string(response.body.ahead_by) + " commit(s) ahead of legacy production (" + response.body.status + ")")
              : ("no revision annotation, or GitHub does not know the commit (HTTP " + string(response.status) + ")")
            outputs:
              - name: status
                fromExpression: response.body.status
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./gitops
        - uses: yaml-update
          config:
            path: ./gitops/apps/codeai/deployments/production/values.yaml
            updates:
              - key: image
                value: ghcr.io/code-dot-org/cdo-rails@${{ imageFrom("ghcr.io/code-dot-org/cdo-rails").Digest }}
        - uses: git-commit
          config:
            path: ./gitops
            message: |
              Promote production to ${{ imageFrom("ghcr.io/code-dot-org/cdo-rails").Digest }} [skip ci]
        - uses: git-push
          config:
            path: ./gitops
        - uses: argocd-update
          config:
            apps:
              - name: codeai-production
                namespace: argocd
