apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: kargo-project-codeai
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-project-codeai
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/code-dot-org/k8s-gitops.git
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitopsRepo }}
            checkout:
              - branch: main
                path: ./gitops
        - uses: yaml-update
          config:
            path: ./gitops/apps/codeai/deployments/production/values.yaml
            updates:
              - key: image
                value: ghcr.io/code-dot-org/cdo-rails@${{ imageFrom("ghcr.io/code-dot-org/cdo-rails").Digest }}
        - uses: git-commit
          config:
            path: ./gitops
            message: |
              Promote production to ${{ imageFrom("ghcr.io/code-dot-org/cdo-rails").Digest }} [skip ci]
        - uses: git-push
          config:
            path: ./gitops
        - uses: argocd-update
          config:
            apps:
              - name: codeai-production
                namespace: argocd
