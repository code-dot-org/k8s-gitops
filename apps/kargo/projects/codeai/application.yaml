apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-project-codeai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Diff via server-side dry run so defaults added by Kargo's mutating webhooks
    # (e.g. inside Warehouse spec.subscriptions[]) don't show as permanent drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/code-dot-org/k8s-gitops.git
    targetRevision: main
    path: apps/kargo/projects/codeai
    directory:
      recurse: true
      exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
