apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # The Kargo chart mints its admission webhook certificate with a
    # cert-manager Issuer and Certificate, so the CRDs and the cainjector must
    # exist before the kargo app syncs. Kargo sits outside the infra bootstrap
    # group and so follows every infra wave; this wave only orders cert-manager
    # among the infra apps, after networking and DNS.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/code-dot-org/k8s-gitops.git
    targetRevision: main
    path: apps/infra/cert-manager/chart
    helm:
      releaseName: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
