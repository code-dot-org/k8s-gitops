apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.keda.serviceAccount.operator.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ printf "%s:role/%s-keda-cloudwatch" .Values.codeai_cluster_config.iam_arn_prefix .Values.codeai_cluster_config.cluster_name | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: true
