codeai_cluster_config: {}

keda:
  # Argo owns CRDs alongside the operator; large CRDs use server-side apply.
  crds:
    install: true

  # One shared installation serves codeai deployments across namespaces.
  watchNamespace: ""

  webhooks:
    enabled: true

  serviceAccount:
    operator:
      create: false
      name: keda-operator-cloudwatch
