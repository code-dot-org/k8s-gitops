apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld
  labels:
    app.kubernetes.io/name: helloworld
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld
    spec:
      containers:
        - name: nginx
          image: {{ .Values.image | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
